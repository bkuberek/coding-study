[versions]
# The JDK releases cstudy supports; coding_study/domain/jdk.py defines the same range and a test
# keeps the two equal.
jdk-minimum = "21"
jdk-maximum = "26"
gson = "2.14.0"
junit = "5.14.4"
# The workspace's Kotlin (its jvm/gradle/libs.versions.toml); a test keeps the two equal.
kotlin = "2.4.21"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
