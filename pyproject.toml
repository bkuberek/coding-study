# The installable coding-study distribution: the `cstudy` CLI from cli/src with the content bundled
# (docs/specs/installation-and-workspaces.md#install). The CLI's lint, type and test settings live
# in cli/ (ruff.toml, pyrightconfig.json, pytest.ini, .importlinter).
[project]
name = "coding-study"
version = "0.5.0"
description = "Local, IDE-first interview practice: the cstudy command-line interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26",
    "pyyaml>=6.0",
    "rich>=15.0",
    "typer>=0.27",
    "watchfiles>=1.1",
]

[project.scripts]
cstudy = "coding_study.entrypoints.launcher:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "python-semantic-release>=10.7",
    "ruff>=0.17",
    "types-jsonschema>=4.26",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Every bundled path lies inside the project root, so a wheel built from the sdist equals one
# built from the checkout. Build output and caches never ship.
[tool.hatch.build]
exclude = [
    "**/node_modules",
    "**/build",
    "**/.gradle",
    "**/.kotlin",
    "**/.venv",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "runners/python/tests",
]

[tool.hatch.build.targets.sdist]
only-include = ["cli/src/coding_study", "problems", "tracks", "runners", "schemas"]

[tool.hatch.build.targets.wheel]
only-include = ["cli/src/coding_study", "problems", "tracks", "runners", "schemas"]
# An editable install (`uv run cstudy` in a checkout) imports the package from cli/src and finds no
# bundled content, so the checkout is the content root.
dev-mode-dirs = ["cli/src"]

[tool.hatch.build.targets.wheel.sources]
"cli/src/coding_study" = "coding_study"
"problems" = "coding_study/content/problems"
"tracks" = "coding_study/content/tracks"
"runners" = "coding_study/content/runners"
"schemas" = "coding_study/content/schemas"

# Versioning (docs/specs/versioning.md). Run from the repository root:
#   uv run semantic-release version
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): v{version} [skip ci]\n\nAutomatically generated by python-semantic-release"
# Not a package build: `uv lock` refreshes the project's version in uv.lock, which
# `uv sync --locked` rejects when it is stale. Nothing is built, published or released.
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
