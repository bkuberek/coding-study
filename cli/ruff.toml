# The CLI's lint settings; the project itself is defined by the root pyproject.toml.
line-length = 100
target-version = "py313"
# Stub goldens are user-facing files checked with the workspace's own tools
# (tests/adapters/languages/python/test_python_golden_checks.py). The workspace template holds no
# Python, and its python/pyproject.toml would make ruff write a cache into it.
extend-exclude = ["tests/golden", "src/coding_study/adapters/workspace_template"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "C4", "RET", "PT", "PTH"]
