# yaml-language-server: $schema=../../schemas/meta.schema.json
id: "{{id}}"
slug: {{slug}}
title: {{title_yaml}}
status: draft
difficulty: {{difficulty}}
track: {{track}}
kind: project
{{patterns}}
{{labels}}
languages: [typescript]
levels:
  - {level: 1, title: Answer on one endpoint}
  - {level: 2, title: Answer on a second endpoint}
comparator: {type: exact}
project:
  grading: http
  image: node:24-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
  commands:
    install: [corepack, pnpm, install, --frozen-lockfile, --ignore-scripts]
    run: [node, src/server.ts]
    test: [node, --test]
  app: {port_env: PORT, port: 8000, health: /health, ready_timeout_s: 60}
  env:
    PORT: "8000"
  install_env:
    COREPACK_HOME: /cache/corepack
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_store_dir: /cache/pnpm-store
    CI: "true"
  requires:
    lock: pnpm-lock.yaml
    sizes: {install_mb: 27, images_mb: {app: 77}, memory_mb: 300}
approaches:
  - {id: reference, name: Reference, role: optimal, time: "per request", space: "per request"}
