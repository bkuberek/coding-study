# yaml-language-server: $schema=../../schemas/meta.schema.json
id: "{{id}}"
slug: {{slug}}
title: {{title_yaml}}
status: draft
difficulty: {{difficulty}}
track: {{track}}
kind: project
{{patterns}}
languages: [python]
levels:
  - {level: 1, title: Keep counts}
  - {level: 2, title: Share the counts}
signature:
  class:
    name: {{class_name}}
    constructor: {params: []}
    methods:
      - {name: add, level: 1, params: [{name: key, type: string}, {name: amount, type: int}], returns: {type: int}}
      - {name: count, level: 1, params: [{name: key, type: string}], returns: {type: int}}
      - {name: take, level: 2, params: [{name: key, type: string}, {name: amount, type: int}], returns: {type: bool}}
comparator: {type: ops}
project:
  entry: app.main
  tests: tests
concurrency:
  model: threads
  broken:
    - {id: lost-update, name: Add outside the lock, bug: "add reads a count and writes it back without the lock, so another add in between is lost", caught_by: [s1]}
approaches:
  - {id: reference, name: Reference, role: optimal, time: "O(1) per op", space: "O(n)", time_class: "n", space_class: "n"}
