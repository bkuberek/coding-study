# yaml-language-server: $schema=../../schemas/meta.schema.json
id: "{{id}}"
slug: {{slug}}
title: {{title_yaml}}
status: draft
difficulty: {{difficulty}}
track: {{track}}
kind: function
{{patterns}}
signature:
  function:
    name: {{function_name}}
    params:
      - {name: root, type: TreeNode}
    returns: {type: TreeNode}
comparator: {type: exact}
approaches:
  - {id: reference, name: Reference, role: optimal, time: "O(n)", space: "O(n)", time_class: "n", space_class: "n", oracle: true}
