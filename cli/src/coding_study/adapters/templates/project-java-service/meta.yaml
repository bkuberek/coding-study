  image: gradle:9.8.2-jdk25-alpine@sha256:20d4d9547874206648a7a72991bf3af6d8bc1c8bffc7f32051f682b21f86d027
  commands:
    install: [gradle, --quiet, resolveDependencies]
    run: [sh, scripts/run.sh]
    test: [gradle, --offline, test, --rerun]
  app: {port_env: PORT, port: 8000, health: /health, ready_timeout_s: 120, mem_limit: 512m, install_cache: true}
  env:
    PORT: "8000"
    GRADLE_USER_HOME: /cache/gradle
  install_env:
    GRADLE_USER_HOME: /cache/gradle
  requires:
    lock: gradle/verification-metadata.xml
    sizes: {install_mb: 5, images_mb: {app: 307}, memory_mb: 400}
