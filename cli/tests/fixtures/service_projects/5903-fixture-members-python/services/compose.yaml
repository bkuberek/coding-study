# Backing services only: cstudy adds the network, labels, log limits, capabilities and privileges.
# Each runs as its image's own user, since the entrypoints otherwise step down from root through
# gosu, which needs capabilities a backing service never holds.
services:
  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: postgres
    # Its data goes with each stack, so nothing is synced to disk: on a slow disk, initdb's sync
    # and the checkpoints' fsync take most of the 20 to 40 s a start otherwise waits for Postgres.
    command: [postgres, -c, fsync=off]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: --no-sync
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, pg_isready, -U, app, -d, app, -h, 127.0.0.1]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 250ms
  cache:
    image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    user: redis
    volumes:
      - cachedata:/data
    mem_limit: 64m
    pids_limit: 32
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms
volumes:
  pgdata:
  cachedata:
