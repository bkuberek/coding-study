# Your Python practice project: `cstudy start <slug>` writes practice/<snake_slug>.py here.
# Open this directory as the editor root; pyright and ruff find .venv and cs_support on their own.
[project]
name = "coding-study-practice"
version = "0.1.0"
description = "Python practice files for coding-study"
requires-python = ">=3.13"
dependencies = ["cs-support"]

[dependency-groups]
dev = [
    "debugpy>=1.8",
    "pyright>=1.1.414",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.sources]
cs-support = { path = "../.cs/runtime/runners/python", editable = true }

[tool.pyright]
include = ["practice"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py313"
