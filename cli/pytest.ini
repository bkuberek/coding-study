[pytest]
testpaths = tests
addopts = --strict-markers --import-mode=importlib
pythonpath = .
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    slow: drives a real toolchain (Gradle, Node, tsc, the workspace venv) or real file events; deselect with -m 'not slow'
    jvm: drives Gradle, javac, kotlinc or a JVM runner on the JDK the shell selects, and is also slow; CI runs these on JDK 21 and JDK 26 (-m jvm)
    network: reaches a host off the loopback, which the fast tests may not (tests/network_guard.py); the test's docstring gives the reason
