[pytest]
testpaths = tests
addopts = --strict-markers --import-mode=importlib
pythonpath = .
markers =
    slow: drives a real toolchain (Gradle, Node, tsc, the workspace venv) or real file events; deselect with -m 'not slow'
    jvm: drives Gradle, javac, kotlinc or a JVM runner on the JDK the shell selects, and is also slow; CI runs these on JDK 21 and JDK 26 (-m jvm)
