<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cstudy README header</title>
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    position: relative;
    width: 1200px;
    height: 300px;
    box-sizing: border-box;
    border-radius: 24px;
    background: #111110;
    overflow: hidden;
  }
  .icon {
    position: absolute;
    left: 72px;
    top: 86px;
    width: 128px;
    height: 128px;
    border-radius: 30px;
    background: #ede6d8;
  }
  .icon svg { display: block; }
  .name {
    position: absolute;
    left: 228px;
    top: 58px;
    margin: 0;
    font: 700 94px/1.2 "JetBrains Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    color: #ede6d8;
    letter-spacing: 0;
  }
  .tagline {
    position: absolute;
    left: 232px;
    top: 176px;
    margin: 0;
    font: italic 400 44px/1.2 "EB Garamond", "Cormorant Garamond", "P052", "Palatino Linotype", Palatino, Charter, Georgia, serif;
    color: #ff8050;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="128" height="128" viewBox="0 0 128 128" fill="none">
      <path d="M30 40 L56 63 L30 86" stroke="#111110" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="68" y="83" width="28" height="9" rx="2" fill="#ff8050"/>
    </svg>
  </div>
  <p class="name">cstudy</p>
  <p class="tagline">Learn it. Practice it. Prove it.</p>
</div>
</body>
</html>
