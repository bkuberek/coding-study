slug: versioned-memory-store
title: Versioned Memory Store
summary: "Implement MemoryStore: a shared memory whose changes name the version their writer read and are refused, with the current version, once it has moved on, so no writer erases an update unseen."
status: ready
difficulty: easy
track: practical
kind: design
patterns: [arrays-hashing]
domains: [ai-llm, backend]
job_roles: [ai-engineer, backend]
scope: function
