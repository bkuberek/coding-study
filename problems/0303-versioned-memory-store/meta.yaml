    name: MemoryStore
    constructor: {params: []}
    methods:
      - {name: get, params: [{name: key, type: string}], returns: {type: string}}
      - {name: version, params: [{name: key, type: string}], returns: {type: int}}
      - {name: write, params: [{name: key, type: string}, {name: expectedVersion, type: int}, {name: value, type: string}], returns: {type: "int[]"}}
      - {name: forget, params: [{name: key, type: string}, {name: expectedVersion, type: int}], returns: {type: "int[]"}}
comparator: {type: ops}
approaches:
