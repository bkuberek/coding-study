  - {level: 4, title: Applying the plan}
signature:
  class:
    name: PlanEngine
    constructor: {params: []}
    methods:
      - {name: desire, level: 1, params: [{name: address, type: string}, {name: attributes, type: "list<list<string>>"}], returns: {type: bool}}
      - {name: remove, level: 1, params: [{name: address, type: string}], returns: {type: bool}}
