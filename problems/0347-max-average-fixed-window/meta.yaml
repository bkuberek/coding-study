id: "0347"
slug: max-average-fixed-window
title: Maximum Average of a Fixed Window
summary: "Find the highest average over any run of exactly k neighbouring numbers. A first sliding window, whose width never changes, before windows that grow and shrink."
status: ready
difficulty: easy
track: dsa
kind: function
patterns: [sliding-window]
domains: [algorithms]
job_roles: [general]
scope: function
signature:
  function:
    name: maxWindowAverage
    params:
      - {name: nums, type: "int[]"}
      - {name: k, type: int}
    returns: {type: double}
comparator: {type: float, tolerance: 1.0e-5}
approaches:
  - {id: recompute, name: Add up every window from scratch, role: brute, time: "O(n * k)", space: "O(1)", time_class: "n^2", space_class: "1", oracle: true}
  - {id: sliding-window, name: Slide the window and update its sum, role: optimal, time: "O(n)", space: "O(1)", time_class: "n", space_class: "1"}
perf:
  size_param: length of nums, with k = n/2
  size_ladder: [1000, 2000, 5000, 10000]
