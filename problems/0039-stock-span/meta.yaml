  class:
    name: StockSpanner
    constructor: {params: []}
    methods:
      - {name: span, params: [{name: price, type: int}], returns: {type: int}}
comparator: {type: ops}
approaches:
  - {id: scan-back, name: Keep every price and walk back on each call, role: brute, time: "O(n) per call", space: "O(n)", time_class: "n^2", space_class: "n", oracle: true}
  - {id: monotonic-stack, name: Stack of prices with the spans they absorbed, role: optimal, time: "O(1) amortized per call", space: "O(n)", time_class: "n", space_class: "n"}
perf:
