# Backing services only: cstudy adds the network, labels, log limits, capabilities and privileges.
# Postgres runs as the image's own user, since its entrypoint otherwise steps down from root
# through gosu, which needs capabilities a backing service never holds.
#
# Moto runs as nobody: it runs as root by default and needs none of it. It keeps an object
# larger than a few megabytes in a temporary file, so /tmp is a volume on disk rather than a
# tmpfs, whose pages would count against its memory limit. It still reads a whole object into
# memory to serve it, which the bulk file of 160 MB needs room for.
services:
  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, pg_isready, -U, app, -d, app, -h, 127.0.0.1]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 250ms
  aws:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    user: "65534:65534"
    volumes:
      - mototmp:/tmp
    mem_limit: 512m
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/data.json', timeout=1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms
volumes:
  pgdata:
  mototmp:
