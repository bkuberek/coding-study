# yaml-language-server: $schema=../../schemas/meta.schema.json
id: "0284"
slug: csv-upload-ingestion-typescript
title: CSV Upload Ingestion (TypeScript)
status: ready
difficulty: hard
track: practical
kind: project
domains: [backend]
job_roles: [backend, platform]
scope: project
languages: [typescript]
summary: Suppliers upload delivery files to S3, and each upload puts an event on SQS. Build the service that streams files bigger than its memory into Postgres, reports bad rows, and loads each upload once despite duplicates and crashes.
levels:
  - {level: 1, title: Load an upload}
  - {level: 2, title: Bad rows and big files}
  - {level: 3, title: "Twice, never, and halfway"}
  - {level: 4, title: Only finished uploads}
comparator: {type: exact}
project:
  grading: http
  image: node:24-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
  commands:
    install: [corepack, pnpm, install, --frozen-lockfile, --ignore-scripts]
    bootstrap: [node, scripts/setup.ts]
    run: [node, src/server.ts]
    test: [node, --test, --test-concurrency=1]
    # The one case that restarts the app does so while it loads the bulk file, and must find the
    # data as the crash left it, as a real restart would: a rollback that did not happen, or a file
    # counted twice, shows only then. So there is nothing to reset; S23 asks for the command.
    reset: ["true"]
    grade_setup: [node, "{problem}/grading/grade_setup.ts"]
  # The memory limit is part of the problem: the bulk file of 160 MB is bigger than it.
  app: {port_env: PORT, port: 8000, health: /health, ready_timeout_s: 60, mem_limit: 128m}
  env:
    PORT: "8000"
    DATABASE_URL: postgres://app:app@db:5432/app
    AWS_ENDPOINT_URL: http://aws:5000
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: sandbox
    AWS_SECRET_ACCESS_KEY: sandbox
    UPLOAD_BUCKET: uploads
    REPORT_BUCKET: upload-reports
    UPLOAD_QUEUE_URL: http://aws:5000/123456789012/upload-events
    RESULT_QUEUE_URL: http://aws:5000/123456789012/import-results
    DEAD_LETTER_QUEUE_URL: http://aws:5000/123456789012/upload-events-dlq
  install_env:
    COREPACK_HOME: /cache/corepack
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_store_dir: /cache/pnpm-store
    CI: "true"
  services: services/compose.yaml
  grader_reach: [aws:5000]
  requires:
    lock: pnpm-lock.yaml
    services: [postgres, moto]
    # Measured on arm64: the app peaked at 80 MiB loading the bulk file, Postgres at 104 MiB, and
    # the emulator at its 512m, page cache included, with 220 MiB of it its own.
    sizes: {install_mb: 46, images_mb: {app: 81, postgres: 117, moto: 102}, memory_mb: 700}
approaches:
  - {id: reference, name: "Stream each file into one transaction that claims its upload first, and delete the event only after the commit", role: optimal, time: "per file", space: "per batch"}
related: [idempotent-document-consumer-typescript, inventory-reservations-typescript]
estimate_minutes: 300
