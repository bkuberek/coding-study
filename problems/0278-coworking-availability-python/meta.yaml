  - {level: 1, title: Desks by day}
  - {level: 2, title: Rooms from the vendor}
  - {level: 3, title: When the vendor fails}
  - {level: 4, title: A second vendor}
comparator: {type: exact}
project:
  grading: http
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
  commands:
    install: [uv, sync, --frozen, --no-build]
    run: [.venv/bin/python, src/server.py]
    test: [.venv/bin/python, -P, -m, pytest]
  app: {port_env: PORT, port: 8000, health: /health, ready_timeout_s: 60}
  env:
    PORT: "8000"
    ROOM_VENDOR_URL: http://room-vendor:8080
    ANNEX_VENDOR_URL: http://annex-vendor:8080
