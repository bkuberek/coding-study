id: "0204"
slug: read-write-lock
title: Read-Write Lock
status: ready
difficulty: hard
track: concurrency
kind: concurrent
languages: [java, kotlin, python, typescript]
signature:
  class:
    name: ReadWriteLock
    constructor: {params: []}
    methods:
      - {name: acquireRead, blocking: true, params: [], returns: {type: void}}
      - {name: releaseRead, params: [], returns: {type: void}}
      - {name: acquireWrite, blocking: true, params: [], returns: {type: void}}
      - {name: releaseWrite, params: [], returns: {type: void}}
      - {name: tryAcquireRead, params: [], returns: {type: bool}}
      - {name: tryAcquireWrite, params: [], returns: {type: bool}}
comparator: {type: ops}
concurrency:
  model: {java: threads, kotlin: threads, python: threads, typescript: async}
  jvm_threads: [platform, virtual]
  runs: 3
  deadline_ms: 5000
  broken:
    - id: unlocked-count
      name: Reader count without a lock
      bug: Readers check the writer flag and bump a shared counter without mutual exclusion, so a writer can enter between a reader's check and its increment
      languages: [java, kotlin, python]
      caught_by: [s1]
    - id: if-not-while
      name: Writer wait guarded by if
      bug: A woken writer does not re-check for readers and writers, so it enters while another worker holds the lock
      caught_by: [s2]
approaches:
  - {id: monitor, name: Counters and conditions under one lock, role: optimal, time: "O(1) per op", space: "O(waiters)"}
