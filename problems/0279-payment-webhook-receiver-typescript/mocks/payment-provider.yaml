scenarios:
  outage:
    visible: true
    status: 503
    headers: {Content-Type: application/json}
    body: {error: service unavailable}
  slow:
    visible: true
    delay_ms: 3000
  rate_limited:
    visible: true
    status: 429
    headers: {Content-Type: application/json, Retry-After: "1"}
    body: {error: too many requests}
  garbled:
    status: 200
    headers: {Content-Type: application/json}
    body: '{"order": "ord_'
  wrong_shape:
    status: 200
    headers: {Content-Type: application/json}
    body: {status: ok}
  lagging:
    route: events-ord_4009
    body_file: bodies/ord_4009-lagging.json
