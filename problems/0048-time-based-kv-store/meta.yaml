id: "0048"
slug: time-based-kv-store
title: Time-Based Key-Value Store
summary: "Implement TimeMap, a store that keeps every version of every key: a write records a value at a time, and a read returns the latest value written at or before a given time."
status: ready
difficulty: medium
track: dsa
kind: design
patterns: [binary-search, arrays-hashing]
domains: [algorithms]
job_roles: [general]
scope: function
signature:
  class:
    name: TimeMap
    constructor: {params: []}
    methods:
      - {name: set, params: [{name: key, type: string}, {name: value, type: string}, {name: timestamp, type: int}], returns: {type: void}}
      - {name: get, params: [{name: key, type: string}, {name: timestamp, type: int}], returns: {type: string}}
comparator: {type: ops}
approaches:
  - {id: scan-history, name: Scan the key's history from the newest entry, role: brute, time: "O(k) per get", space: "O(n)", time_class: "n^2", space_class: "n", oracle: true}
  - {id: binary-search-history, name: Binary search in the key's history, role: optimal, time: "O(log k) per get", space: "O(n)", time_class: "n log n", space_class: "n"}
