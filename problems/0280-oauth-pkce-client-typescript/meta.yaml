kind: project
domains: [identity, security]
job_roles: [backend, security-engineer]
scope: project
languages: [typescript]
summary: A web app signs its users in with OpenID Connect against a real identity provider. Build its side of the login, with PKCE, state and nonce, ID tokens checked against rotating keys, rotating refresh tokens, and a logout that ends it all.
levels:
  - {level: 1, title: Sign in with the code flow and PKCE}
  - {level: 2, title: Trust the ID token}
  - {level: 3, title: Refresh and revoke}
  - {level: 4, title: Sign out and keep tokens secret}
comparator: {type: exact}
