  function:
    name: decodeString
    params:
      - {name: s, type: string}
    returns: {type: string}
comparator: {type: exact}
approaches:
  - {id: innermost-first, name: Expand the innermost group and rebuild the string, role: brute, time: "O(g (n + m))", space: "O(n + m)", time_class: "n^2", space_class: "n", oracle: true}
  - {id: recursive, name: Recursive descent over the groups, role: optimal, time: "O(n + d m)", space: "O(n + m)", time_class: "n", space_class: "n"}
  - {id: two-stacks, name: Stacks of counts and partial strings, role: optimal, time: "O(n + d m)", space: "O(n + m)", time_class: "n", space_class: "n"}
