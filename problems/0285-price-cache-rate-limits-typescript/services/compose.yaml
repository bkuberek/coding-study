# Backing services only: cstudy adds the network, labels, log limits, capabilities and privileges.
# Valkey is the BSD-licensed fork of Redis, and speaks its protocol, so a Redis client reaches it.
# It runs as the image's own user, since its entrypoint otherwise steps down from root through
# setpriv, which needs capabilities a backing service never holds. It keeps nothing on disk: the
# root filesystem is read-only, and a cache and a limiter start empty with every stack anyway.
services:
  store:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    user: valkey
    command: [valkey-server, --save, "", --appendonly, "no"]
    mem_limit: 64m
    pids_limit: 32
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms
