id: "0285"
slug: price-cache-rate-limits-typescript
title: Price Cache and Rate Limits (TypeScript)
status: ready
difficulty: medium
track: practical
kind: project
domains: [backend]
job_roles: [backend, platform]
scope: project
languages: [typescript]
summary: A shop's public price API sits in front of a slow pricing engine. Put a cache on a Redis-compatible store in front of it, limit each client however hard it pushes, and keep a hot price from sending a crowd to the engine when it expires.
levels:
  - {level: 1, title: Cache-aside}
  - {level: 2, title: Rate limits}
  - {level: 3, title: Writes and stampedes}
  - {level: 4, title: Hot prices}
comparator: {type: exact}
project:
  grading: http
  image: node:24-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
  commands:
    install: [corepack, pnpm, install, --frozen-lockfile, --ignore-scripts]
    bootstrap: [node, scripts/bootstrap.ts]
    run: [node, src/server.ts]
    test: [node, --test, --test-concurrency=1]
    reset: [node, scripts/reset.ts]
  app: {port_env: PORT, port: 8000, health: /health, ready_timeout_s: 60}
  env:
    PORT: "8000"
    REDIS_URL: redis://store:6379
    PRICING_URL: http://pricing:8080
  install_env:
    COREPACK_HOME: /cache/corepack
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_store_dir: /cache/pnpm-store
    CI: "true"
  mocks:
    - {name: pricing, config: mocks/pricing.yaml}
  services: services/compose.yaml
  requires:
    lock: pnpm-lock.yaml
    services: [valkey]
    sizes: {install_mb: 34, images_mb: {app: 81, mocks: 43, valkey: 19}, memory_mb: 150}
approaches:
