  - {level: 2, title: Rows in any order}
  - {level: 3, title: Managers and chains}
  - {level: 4, title: Indented outline}
signature:
  class:
    name: OrgChart
    constructor: {params: []}
    methods:
      - {name: load, level: 1, params: [{name: rows, type: "list<list<string>>"}], returns: {type: void}}
      - {name: roots, level: 1, params: [], returns: {type: "list<string>"}}
      - {name: nameOf, level: 1, params: [{name: employee, type: string}], returns: {type: string}}
