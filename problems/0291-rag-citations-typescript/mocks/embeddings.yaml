          - older than 30 days gets store credit instead, once a team lead approves it. Never refund in cash, and never
          - refund in cash, and never refund a gift card.
    response:
      status: 200
      body:
        object: list
        model: '{{request.body.model}}'
        data:
          - object: embedding
            index: 0
