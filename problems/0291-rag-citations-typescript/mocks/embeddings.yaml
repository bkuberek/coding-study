# The team's embeddings service: help-embed-1, a stand-in for an embedding model, on the
# generic shape most embeddings APIs shared in their public documentation in November 2026.
# It knows the vectors of fixed texts only, so each route is one batch it knows: a document's
# chunks, cut as the statement says, in one list, or a question alone in its list. Each vector is
# a function of its text (cli/tests/content/test_rag_citations.py states it and checks every
# route), and any other input is 400. Hidden scenarios are what a graded run adds.
shape_version: "generic embeddings style, public docs of 2026-11"
routes:
