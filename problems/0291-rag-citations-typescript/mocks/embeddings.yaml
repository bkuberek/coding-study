scenarios:
  rate_limited_then_ok:
    visible: true
    sequence:
      - status: 429
        headers:
          Retry-After: '1'
        body:
          error:
            type: rate_limit
            message: 'Too many requests: retry after 1 s.'
      - status: 200
  outage:
    visible: true
    status: 503
    body:
      error:
        type: unavailable
        message: The embeddings service is unavailable.
  rate_limited:
    status: 429
    headers:
      Retry-After: '1'
    body:
      error:
        type: rate_limit
        message: 'Too many requests: retry after 1 s.'
  update_outage:
    route: embed-refunds-updated
    status: 503
    body:
      error:
        type: unavailable
        message: The embeddings service is unavailable.
