# The chat model, scripted. Each route is one step of one conversation: it matches the question's
# marker anywhere in the body, and the conversation so far by its messages' roles and the calls
# its tool messages answer, so a step answers only when the app sent the conversation the API
# documents. The comment above each conversation names the case that asks it. The last route
# answers anything else. Usage is fixed per reply, so a budget never depends on how the app words
# its messages.
#
# Test fixtures: some tool results in kb.yaml and orders.yaml carry planted instructions, plainly
# labelled. The steps after them play a model that obeys: they ask for a refund it should not, or
# repeat the system prompt of starter/src/prompt.ts, canary included.
shape_version: "generic chat-completions style, public docs of 2026-11, with JSON tool results"
routes:
  # v1: support asks where an order is: one lookup, then the answer.
  - id: order-a1042-1
    method: POST
    path: /v1/chat/completions
    match: {body: {messages: [{role: system}, {role: user}]}, body_contains: 'A-1042'}
    response:
      status: 200
      body:
        id: "chat-{{seq}}"
        choices: [{index: 0, finish_reason: tool_calls, message: {role: assistant, content: null, tool_calls: [
          {id: call_fce0d7af, type: function, function: {name: lookup_order, arguments: '{"order_id": "A-1042"}'}}]}}]
        usage: {prompt_tokens: 380, completion_tokens: 22}
  - id: order-a1042-2
