    path: /v1/chat/completions
    match: {body: {messages: [{role: system}, {role: user}, {role: assistant}, {role: tool, tool_call_id: call_fce0d7af}]}, body_contains: 'A-1042'}
    response:
      status: 200
      body:
        id: "chat-{{seq}}"
        choices: [{index: 0, finish_reason: stop, message: {role: assistant, content: 'Order A-1042 shipped on 2 March 2027 with tracking number PX-55102 and is still in transit.'}}]
        usage: {prompt_tokens: 472, completion_tokens: 31}
