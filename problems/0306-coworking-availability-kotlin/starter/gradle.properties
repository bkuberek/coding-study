# Each command cstudy runs is a container of its own, so a daemon would only outlive its build, and
# the Kotlin compiler runs inside Gradle's own process rather than in a daemon of its own.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC
org.gradle.console=plain
org.gradle.welcome=never
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
